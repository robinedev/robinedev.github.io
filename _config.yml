# ===== aube paul // jekyll config =====
# No gem-based theme and no plugins on purpose: every layout, style and
# script in this repo is local and readable, so there is no third-party
# code in the build path. GitHub Pages only needs this file to resolve
# the layouts in _layouts/.

title: Aube Paul · IT Engineer
handle: aubep
tagline: Building IT infrastructure for startups
description: >-
  Aube Paul, IT engineer. Identity, endpoint automation, and security
  operations for startups. Previously HashiCorp and TravelPerk.
author: Aube Paul
role: IT engineer
bio: >-
  I do startup IT, which means endpoints, identity, and all the
  paperwork an audit asks for. Mostly I'm automating the boring half
  so nobody has to do the same thing twice, and there's almost always
  some new tool on the go and a cup of tea going with it.

# sidebar note, shown on every page. delete to hide it.
blurb: >-
  This is where I put my thoughts on the tech world, whatever I'm
  building, how I'm learning it, and a few personal things along the
  way.

# the sidebar block. edit freely, delete to hide it.
now:
  - label: learning
    text: Okta, and TypeScript
  - label: reading
    text: I Have No Mouth and I Must Scream, by Harlan Ellison
  - label: steeping
    text: hibiscus
url: https://robinedev.github.io
baseurl: ""

# ===== build =====
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
permalink: /doc/blog/:title/
timezone: America/New_York

# ===== front matter defaults =====
defaults:
  - scope:
      path: ""
    values:
      layout: page
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - .gitignore
  - preview
