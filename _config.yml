# ===== aube paul // jekyll config =====
# No gem-based theme and no plugins on purpose: every layout, style and
# script in this repo is local and readable, so there is no third-party
# code in the build path. GitHub Pages only needs this file to resolve
# the layouts in _layouts/.

title: Aube Paul · IT Engineer
handle: aubep
tagline: Building IT infrastructure for startups
description: >-
  Aube Paul, IT engineer. Identity, endpoint automation, and security
  operations for startups. Previously HashiCorp and TravelPerk.
author: Aube Paul
role: IT engineer
bio: >-
  Startup IT, which in practice means endpoints, identity, and the
  paperwork an audit asks for. I automate the boring half so nobody
  does the same thing twice. Always trying new tech, usually mid-cup.

# the sidebar block. edit freely, delete to hide it.
now:
  - label: learning
    text: Okta, and TypeScript
  - label: reading
    text: I Have No Mouth and I Must Scream, by Harlan Ellison
  - label: steeping
    text: hibiscus
url: https://robinedev.github.io
baseurl: ""

# ===== build =====
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
permalink: /doc/blog/:title/
timezone: America/New_York

# ===== front matter defaults =====
defaults:
  - scope:
      path: ""
    values:
      layout: page
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - .gitignore
  - preview
